# Sanctions Exposure Index Configuration
project:
  id: sanctions-exposure-index
  name: "Sanctions Exposure Index"
  description: "Track global sanctions lists, entity relationships, and exposure networks."

openrouter:
  model: "nvidia/nemotron-3-super-120b-a12b:free"
  fallback_model: "z-ai/glm-5.2:free"

news_query: "(sanctions OR OFAC OR embargo)"
include_forex: true

sources:
  - name: "Google News RSS"

refresh:
  interval_hours: 6
  retry_attempts: 3

scoring:
  scale: "1-10"
  thresholds:
    high: 7
    medium: 4
    low: 0
